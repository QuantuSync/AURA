  <title id="t">E1 · DANA Valencia 2024 — hindcast ILUSTRATIVO del pipeline AURA v2</title>
  <desc id="d">2024-10-28 … 2024-10-31 · 39.42, -0.72 · 24 horas · regla C1 · NO es validación operativa: sin ground truth y con el DAG de juguete de la demo. Series horarias de precipitación de las tres fuentes, con el hull del conjunto credal fusionado y la banda que acumula el 95 % de la masa. Eje vertical symlog (lineal hasta 10 mm/h) porque el hull alcanza el domainBound de 500 mm/h. Ejercicio ILUSTRATIVO del comportamiento del pipeline sobre datos reales, no una validación operativa: no hay ground truth y el DAG es el de juguete de la demo.</desc>
