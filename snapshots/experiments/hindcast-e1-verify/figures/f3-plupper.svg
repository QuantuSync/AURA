  <title id="t">E1 · DANA Valencia 2024 — hindcast ILUSTRATIVO del pipeline AURA v2</title>
  <desc id="d">2024-10-28 … 2024-10-31 · 39.42, -0.72 · 24 horas · regla C1 · NO es validación operativa: sin ground truth y con el DAG de juguete de la demo. Cota superior demostrada Pl(E) de la probabilidad de inundación, hora a hora, en escala logarítmica con suelo en 1e-8. La línea discontinua es el umbral p_crít = 0.05 que separa 'warning' de 'critical'. Los puntos grises son horas con plUpper exactamente 0. Ejercicio ILUSTRATIVO del comportamiento del pipeline sobre datos reales, no una validación operativa: no hay ground truth y el DAG es el de juguete de la demo.</desc>
