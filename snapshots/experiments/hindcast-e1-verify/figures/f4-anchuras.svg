  <title id="t">E1 · DANA Valencia 2024 — hindcast ILUSTRATIVO del pipeline AURA v2</title>
  <desc id="d">2024-10-28 … 2024-10-31 · 39.42, -0.72 · 24 horas · regla C1 · NO es validación operativa: sin ground truth y con el DAG de juguete de la demo. Anchura del intervalo de cada método hora a hora, en escala logarítmica. Las de los dos baselines son CONSTANTES por construcción: dependen solo de σ y δ, no de la evidencia, de modo que no se enteran de nada de lo que pasa en el evento. Ejercicio ILUSTRATIVO del comportamiento del pipeline sobre datos reales, no una validación operativa: no hay ground truth y el DAG es el de juguete de la demo.</desc>
