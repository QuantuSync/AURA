  <title id="t">E1 · DANA Valencia 2024 — hindcast ILUSTRATIVO del pipeline AURA v2</title>
  <desc id="d">2024-10-28 … 2024-10-31 · 39.42, -0.72 · 24 horas · regla C1 · NO es validación operativa: sin ground truth y con el DAG de juguete de la demo. K_máx por pares y K_global n-ario hora a hora, con los tres umbrales de la regla C1: κ₁ y κ₂ se comparan con K_máx (Def. 3.6) y κ_deg es la guardia de degeneración sobre K_global. Ejercicio ILUSTRATIVO del comportamiento del pipeline sobre datos reales, no una validación operativa: no hay ground truth y el DAG es el de juguete de la demo.</desc>
